# Job manual que crea (idempotente, CREATE ... IF NOT EXISTS) los objetos del Lakehouse.
# Agregar una tabla nueva: un .sql en src/ddls/<capa>/ + una task aquí.
#
# Catálogo parametrizado (spec Cambio 1): cada sql_task recibe `catalog` en `parameters`
# y los .sql lo consumen como parameter marker nombrado junto con el schema destino.
resources:
  jobs:
    job_ddl_lakehouse:
      name: job_ddl_lakehouse_gzl
      max_concurrent_runs: 1
      timeout_seconds: 900
      tags:
        dominio: ddl
        proyecto: wizard-bank

      tasks:
        # ── Setup: catálogo bronze y schemas lending_gzl / cobranzas_gzl ──
        - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_lending: ${var.schema_lending}
              schema_cobranzas: ${var.schema_cobranzas}
            file:
              path: ../src/ddls/00_setup/00_create_schemas.sql

        # ── Bronze · bronze.lending_gzl ──
        - task_key: paises_brz
          depends_on:
            - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_lending: ${var.schema_lending}
            file:
              path: ../src/ddls/bronze/paises_brz.sql

        - task_key: campanias_brz
          depends_on:
            - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_lending: ${var.schema_lending}
            file:
              path: ../src/ddls/bronze/campanias_brz.sql

        - task_key: productos_prestamo_brz
          depends_on:
            - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_lending: ${var.schema_lending}
            file:
              path: ../src/ddls/bronze/productos_prestamo_brz.sql

        - task_key: clientes_brz
          depends_on:
            - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_lending: ${var.schema_lending}
            file:
              path: ../src/ddls/bronze/clientes_brz.sql

        - task_key: ofertas_preaprobadas_brz
          depends_on:
            - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_lending: ${var.schema_lending}
            file:
              path: ../src/ddls/bronze/ofertas_preaprobadas_brz.sql

        - task_key: solicitudes_prestamo_brz
          depends_on:
            - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_lending: ${var.schema_lending}
            file:
              path: ../src/ddls/bronze/solicitudes_prestamo_brz.sql

        - task_key: desembolsos_brz
          depends_on:
            - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_lending: ${var.schema_lending}
            file:
              path: ../src/ddls/bronze/desembolsos_brz.sql

        - task_key: tipos_cambio_brz
          depends_on:
            - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_lending: ${var.schema_lending}
            file:
              path: ../src/ddls/bronze/tipos_cambio_brz.sql

        # ── Bronze · bronze.cobranzas_gzl ──
        - task_key: cuotas_brz
          depends_on:
            - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_cobranzas: ${var.schema_cobranzas}
            file:
              path: ../src/ddls/bronze/cuotas_brz.sql

        - task_key: pagos_brz
          depends_on:
            - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_cobranzas: ${var.schema_cobranzas}
            file:
              path: ../src/ddls/bronze/pagos_brz.sql

        - task_key: gestiones_cobranza_brz
          depends_on:
            - task_key: setup_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog_bronze}
              schema_cobranzas: ${var.schema_cobranzas}
            file:
              path: ../src/ddls/bronze/gestiones_cobranza_brz.sql

        # ── Silver / Gold: pendientes (src/ddls/silver, src/ddls/gold) ──
