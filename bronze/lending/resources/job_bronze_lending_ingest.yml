# Job manual: ingesta con Auto Loader de landing en S3 → bronze.lending.<tabla>_brz.
# Las tablas destino las crea bundle_ddl; este job solo agrega filas (append-only).
#
# Imports: spark_python_task corre src/main.py como script; main.py agrega src/ al sys.path,
# así resuelven config/, ingestion/ y utils/ sin empaquetar un wheel.
resources:
  jobs:
    job_bronze_lending_ingest:
      name: job_bronze_lending_ingest
      max_concurrent_runs: 1

      # Job continuo: apenas termina una corrida arranca la siguiente. Pausado por defecto
      # (activar desde la UI o cambiando a UNPAUSED). Sin timeout_seconds ni max_retries de task:
      # no aplican a jobs continuos (los reintentos los maneja el propio job con backoff).
      continuous:
        pause_status: PAUSED

      tags:
        capa: bronze
        dominio: ingesta
        proyecto: wizard-bank

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - pyyaml

      tasks:
        - task_key: ingest_lending
          environment_key: default
          spark_python_task:
            python_file: ../src/main.py
            parameters:
              - --catalog
              - ${var.catalog_bronze}
