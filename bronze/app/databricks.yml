# Declarative Automation Bundle: ingesta de la telemetría de la app (topic Kafka) → Bronze (schema app).
# Spec: specs/bronze_ingest_app.md
bundle:
  name: app
  uuid: cd732bb0-5f7d-4261-a7a8-cb9766eb6d05

include:
  - resources/*.yml

variables:
  catalog_bronze:
    description: Catálogo destino de la capa Bronze. Cada target puede sobrescribirlo.
    default: bronze
  bucket_root:
    description: Raíz del bucket del lakehouse (landing, checkpoints). Acceso vía external location de UC.
    default: s3://lakehouse-datawizard

targets:
  dev:
    # Recursos con prefijo '[dev <usuario>]' y schedules/triggers pausados.
    mode: development
    default: true
    workspace:
      host: https://dbc-dfb14324-e95d.cloud.databricks.com
      profile: free-edition
    variables:
      catalog_bronze: bronze

  prod:
    mode: production
    workspace:
      host: https://dbc-dfb14324-e95d.cloud.databricks.com
      profile: free-edition
      # Una sola copia del bundle en prod, bajo el usuario que despliega.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_bronze: bronze
