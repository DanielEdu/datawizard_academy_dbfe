# Declarative Automation Bundle: ingesta S3 → Bronze (schema cobranzas_jhersson) con Auto Loader.
# Reto: schema destino cobranzas_jhersson (bronze.cobranzas_jhersson.<tabla>_brz).
# Fuente: sistema legado on-premise de cobranzas (landing/wizard_bank_onp).
# Mismo código que bronze/lending; spec: specs/bronze-ingest-cobranzas.md
bundle:
  name: cobranzas_jhersson
  uuid: 85c24242-dc60-4351-9bc6-80ebac63d780

include:
  - resources/*.yml

variables:
  catalog_bronze:
    description: Catálogo destino de la capa Bronze. Cada target puede sobrescribirlo.
    default: bronze

targets:
  dev:
    # Recursos con prefijo '[dev <usuario>]' y schedules/triggers pausados.
    mode: development
    default: true
    workspace:
      host: https://dbc-ef8efcd7-c7c9.cloud.databricks.com
      profile: free-edition
    variables:
      catalog_bronze: bronze

  prod:
    mode: production
    workspace:
      host: https://dbc-ef8efcd7-c7c9.cloud.databricks.com
      profile: free-edition
      # Una sola copia del bundle en prod, bajo el usuario que despliega.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_bronze: bronze
