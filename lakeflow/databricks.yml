# Declarative Automation Bundle: el Lakehouse de Wizard Bank en un pipeline declarativo (Sesiones 19 y 20).
# El pipeline lee todo transformations/: Bronze y Silver (S19) y Gold, métricas y feature tables (S20).
# Las metric views (metric_views/) NO son parte del pipeline: se crean con SQL sobre sus tablas Gold (S20, paso 5).
bundle:
  name: lakeflow

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo donde el pipeline publica todas sus tablas.
    default: datawizard_dev
  schema:
    description: Esquema del pipeline en cada ambiente. Dos pipelines no pueden ser dueños de la misma tabla, así que no reutilices el del pipeline creado en la UI (lending).
    default: lending_dev
  landing:
    description: Raíz de landing. El acceso va por la external location de Unity Catalog (sin credenciales aquí).
    default: s3://lakehouse-datawizard/landing

targets:
  dev:
    # Sin `mode: development`: ese modo antepone dev_<usuario>_ a los esquemas y aquí queremos lending_dev a secas.
    # Tomamos de él solo lo útil, explícito en presets. Contra: dos personas en el mismo workspace compartirían lending_dev.
    default: true
    presets:
      pipelines_development: true     # el pipeline corre en modo development (reintentos cortos, cluster que no se apaga al toque)
      trigger_pause_status: PAUSED    # el job no corre solo en dev
      tags:
        ambiente: dev
    workspace:
      host: https://dbc-dfb14324-e95d.cloud.databricks.com
      profile: free-edition
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://dbc-dfb14324-e95d.cloud.databricks.com
      profile: free-edition
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: lending_prod
    resources:
      jobs:
        job_lakehouse_wizard_bank_refresh:
          trigger:
            # En el curso el job de prod queda pausado: no corre solo cada vez que cae un archivo en landing (costo).
            # En una empresa se quita esta línea y prod se actualiza con cada llegada de datos.
            pause_status: PAUSED
